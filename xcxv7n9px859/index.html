<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Páginas imersivas · Bruna Santanna</title>
<meta name="description" content="Um motor no Claude que pesquisa a pauta, escreve o roteiro, monta o carrossel com a sua marca e edita o seu vídeo.">
<meta property="og:type" content="website">
<meta property="og:title" content="Motor de Conteúdo · Bruna Santanna">
<meta property="og:description" content="Você aprova e grava. O sistema pesquisa, escreve, monta a arte com a sua marca e edita o vídeo.">
<meta property="og:image" content="https://brunasantanna.com/fotos/v2/hero-sistema-full.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Instrument Serif local. O arquivo e TTF com extensao .woff2, por isso format('truetype') */
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;
  font-display:swap;src:url(instrument-0.woff2) format('truetype')}

:root{
  --paper:#F3EEE3; --soft:#ECE5D6; --card:#FBF9F3;
  --ink:#14373C; --deep:#0E282C; --green:#435D51;
  --terra:#985A3B; --clay:#B06E4A; --wash:#E0BBA4;
  --pad:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.55 'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
img{display:block;width:100%;height:auto}
h1,h2,h3,p,figure,blockquote,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--clay);outline-offset:4px}
.display{font-family:'Instrument Serif',Georgia,serif;font-weight:400;
  letter-spacing:-.03em;line-height:.96}
.em{font-style:normal;color:var(--terra)}
.wrap{padding-left:var(--pad);padding-right:var(--pad);max-width:1180px;margin:0 auto}

/* kicker */
.kicker{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--terra);font-weight:600;margin-bottom:16px}
.on-dark .kicker{color:var(--wash)}

/* ---------- barra de revisao (some na publicacao) ---------- */
.bar{position:sticky;top:0;z-index:60;background:var(--deep);color:var(--paper);
  padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
.bar div{display:flex;gap:5px}
.bar button{min-height:40px;padding:8px 13px;border:1px solid #f3eee340;border-radius:30px;
  background:none;color:var(--paper);font-size:12px}
.bar button[aria-pressed=true]{background:var(--paper);color:var(--deep)}

/* ============ 1 · HERO DE SANGRIA ============ */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;
  justify-content:flex-end;padding:0 0 34px;overflow:hidden;isolation:isolate}
.hero>picture{position:absolute;inset:0;z-index:-2;display:block}
.hero picture img{width:100%;height:100%;object-fit:cover;object-position:var(--pos)}
.hero:after{content:'';position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,#0e282c8f 0%,#0e282c2e 30%,#0e282cca 66%,#0e282cf5 100%)}
.hero-top{position:absolute;top:0;left:0;right:0;padding:18px var(--pad);display:flex;
  align-items:center;justify-content:space-between;color:var(--paper)}
.hero-top b{font-family:'Instrument Serif',serif;font-weight:400;font-size:20px}
.hero-top small{font-size:9px;letter-spacing:.18em}
.hero-copy{padding:0 var(--pad);color:var(--paper);max-width:1180px;margin:0 auto;width:100%}
.hero .kicker{color:var(--wash)}
.hero h1{font-size:clamp(46px,12.8vw,94px);max-width:12ch}
.hero h1 em{font-style:normal;color:var(--wash);display:block}
.hero-sub{font-size:15px;line-height:1.5;margin:18px 0 22px;max-width:35ch;
  color:#f3eee3e0;font-weight:300}
.hero-cta{display:inline-flex;align-items:center;gap:16px;min-height:56px;padding:16px 26px;
  border:1px solid #f3eee3;border-radius:60px;text-decoration:none;color:var(--paper);
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.hero-cta i{font-style:normal;font-size:17px}
.hero-price{font-size:11.5px;margin-top:13px;color:#f3eee3b3;font-weight:300;line-height:1.5}

/* ============ 2 · PROVAS EMPILHADAS ============ */
.stackblock{padding:56px var(--pad) 66px}
.stackblock h2{font-size:clamp(36px,9.8vw,58px);text-align:center;max-width:15ch;margin:0 auto 38px}
.stackblock .kicker{text-align:center}
.stack{position:relative;max-width:430px;margin:auto}
.stack figure{background:var(--card);padding:9px 9px 0;box-shadow:0 18px 40px #14373c2e;margin:0}
.stack figcaption{font-size:10.5px;padding:10px 4px 12px;color:var(--green);line-height:1.4}
.stack figcaption b{display:block;margin-top:3px;font-weight:600;font-size:9.5px;
  letter-spacing:.04em;text-transform:uppercase;color:var(--terra)}
.stack img{aspect-ratio:1/1;object-fit:cover;object-position:top}
.stack .s1{transform:rotate(-3.5deg);width:82%}
.stack .s2{transform:rotate(2.5deg);width:78%;margin:-14px 0 0 auto;position:relative;z-index:2}
.stack .s3{transform:rotate(-1.5deg);width:74%;margin:-10px auto 0;position:relative;z-index:3}
.stack-note{font-size:11px;color:var(--green);text-align:center;margin-top:34px;font-weight:300}

/* uma prova solta, para o curso */
.oneproof{padding:44px var(--pad);background:var(--card);border-top:1px solid #14373c1f;
  border-bottom:1px solid #14373c1f;text-align:center}
.oneproof blockquote{font-size:clamp(24px,6.6vw,36px);line-height:1.14;max-width:20ch;margin:0 auto}
.oneproof figcaption{font-size:12px;margin-top:18px;color:var(--green)}

/* ============ 3 · DOR, UMA POR VEZ ============ */
.pain{background:var(--deep);color:var(--paper);padding:70px var(--pad) 76px}
.pain h2{font-size:clamp(38px,10.4vw,64px);max-width:14ch;margin-bottom:44px}
.pain h2 em{font-style:normal;color:var(--wash)}
.pain-item{padding:26px 0;border-top:1px solid #f3eee32b;max-width:44ch}
.pain-item b{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--wash);font-weight:600;margin-bottom:11px}
.pain-item p{font-size:16px;font-weight:300;color:#f3eee3e6}
.pain-end{margin-top:48px;font-size:clamp(28px,7.6vw,46px);line-height:1.06;max-width:18ch}
.pain-end span{color:var(--wash)}

/* ============ 4 · FRASE SOZINHA ============ */
.solo{background:var(--soft);min-height:82svh;display:flex;flex-direction:column;
  justify-content:center;padding:70px var(--pad)}
.solo blockquote{font-size:clamp(36px,10.2vw,66px);line-height:1.03;max-width:16ch}
.solo blockquote span{color:var(--terra)}
.solo figcaption{font-size:12px;margin-top:30px;color:var(--green);font-weight:300}
.solo.on-dark{background:var(--deep);color:var(--paper)}
.solo.on-dark blockquote span{color:var(--wash)}
.solo.on-dark figcaption{color:#f3eee395}

/* ============ 5 · NUMERO GIGANTE ============ */
.bignum{background:var(--paper);min-height:78svh;display:flex;flex-direction:column;
  justify-content:center;padding:70px var(--pad);text-align:center}
.bignum strong{font-family:'Instrument Serif',serif;font-weight:400;display:block;
  font-size:clamp(90px,31vw,210px);line-height:.82;color:var(--terra)}
.bignum b{display:block;font-family:'Instrument Serif',serif;font-weight:400;
  font-size:clamp(28px,7.4vw,46px);line-height:1.06;margin-top:14px;letter-spacing:-.02em}
.bignum p{font-size:13px;color:var(--green);margin:26px auto 0;max-width:32ch;font-weight:300}

/* ============ 6 · VIDEO DE SANGRIA ============ */
.videoblock{background:var(--deep);color:var(--paper);padding:66px 0 70px}
.videoblock .head{padding:0 var(--pad);max-width:1180px;margin:0 auto 30px}
.videoblock h2{font-size:clamp(36px,9.8vw,60px);max-width:13ch}
.videoblock h2 em{font-style:normal;color:var(--wash)}
.videoblock .head p{font-size:15px;margin-top:18px;max-width:38ch;
  color:#f3eee3cc;font-weight:300}
.videoblock video{width:100%;max-height:78svh;display:block;background:#0a1f22;object-fit:contain}
.videonote{padding:16px var(--pad) 0;font-size:11px;color:#f3eee38f;max-width:1180px;
  margin:0 auto;font-weight:300}

/* ============ 7 · ENTREGAS ============ */
.deliver{padding:70px 0 76px}
.deliver .head{padding:0 var(--pad);max-width:1180px;margin:0 auto 34px}
.deliver h2{font-size:clamp(38px,10.4vw,64px);max-width:13ch}
/* faixa escura so para a tela real nao se confundir com o bege da pagina */
.shotband{background:var(--deep);padding:44px var(--pad) 46px;margin:0 0 44px}
.mock{max-width:900px;margin:0 auto;border-radius:9px;overflow:hidden;
  background:#0a1f22;box-shadow:0 20px 44px #00000059}
.mock .chrome{display:flex;align-items:center;gap:6px;padding:10px 13px}
.mock .chrome i{width:9px;height:9px;border-radius:50%;background:#f3eee333;flex:none}
.mock .chrome span{font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  color:#f3eee378;margin-left:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mock img{width:100%;display:block}
.shotband figcaption{font-size:11px;color:#f3eee395;font-weight:300;
  max-width:900px;margin:16px auto 0;text-align:center}
.items{padding:0 var(--pad);max-width:1180px;margin:0 auto}
.item{display:grid;grid-template-columns:38px 1fr;gap:14px;padding:28px 0;
  border-top:1px solid #14373c2b}
.item>span{font-family:'Instrument Serif',serif;font-size:32px;color:var(--terra);line-height:1}
.item b{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--terra);font-weight:600;margin-bottom:8px}
.item h3{font-size:20px;font-weight:600;line-height:1.2}
.item p{font-size:15px;margin-top:10px;max-width:46ch;font-weight:300;color:#2c4f54}

/* ============ 8 · ANTES E DEPOIS ============ */
.beforeafter{background:var(--soft);padding:66px var(--pad) 72px}
.beforeafter h2{font-size:clamp(36px,9.8vw,60px);max-width:13ch;margin-bottom:16px}
.beforeafter>p{font-size:15px;max-width:38ch;margin-bottom:32px;font-weight:300;color:#2c4f54}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:600px}
.pair video{width:100%;aspect-ratio:9/16;object-fit:contain;background:#0a1f22}
.pair figcaption{font-size:11px;margin-top:10px;color:var(--green)}

/* ============ 9 · GALERIA DE ARTES ============ */
.artes{padding:70px 0 76px;background:var(--card)}
.artes .head{padding:0 var(--pad);max-width:1180px;margin:0 auto 30px}
.artes h2{font-size:clamp(38px,10.4vw,62px);max-width:12ch}
.artes .head p{font-size:15px;margin-top:18px;max-width:40ch;font-weight:300;color:#2c4f54}
.steps{padding:0 var(--pad);max-width:1180px;margin:0 auto 38px}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:13px 0;
  border-top:1px solid #14373c22;font-size:15px;font-weight:300}
.steps li b{font-family:'Instrument Serif',serif;font-size:20px;font-weight:400;color:var(--terra)}
.rail{display:flex;gap:14px;overflow-x:auto;padding:0 var(--pad) 14px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.rail figure{flex:0 0 74%;max-width:330px;scroll-snap-align:center;margin:0}
.rail button{border:0;padding:0;background:none;width:100%;cursor:zoom-in}
.rail img{aspect-ratio:4/5;object-fit:cover;box-shadow:0 14px 28px #14373c1f}
.rail figcaption{font-size:11px;margin-top:11px;color:var(--green)}
.railnote{padding:18px var(--pad) 0;font-size:11px;color:var(--green);
  max-width:1180px;margin:0 auto;font-weight:300}

/* ============ 10 · ETAPAS ============ */
.flow{padding:70px var(--pad) 76px;background:var(--deep);color:var(--paper)}
.flow h2{font-size:clamp(38px,10.4vw,62px);max-width:13ch;margin-bottom:38px}
.flow h2 em{font-style:normal;color:var(--wash)}
.flow article{padding:24px 0;border-top:1px solid #f3eee32b}
.flow article b{font-family:'Instrument Serif',serif;font-size:19px;font-weight:400;
  color:var(--wash);display:block;margin-bottom:8px}
.flow h3{font-size:20px;font-weight:600}
.flow article p{font-size:15px;margin-top:9px;max-width:46ch;font-weight:300;color:#f3eee3cc}

/* ============ 11 · EXEMPLOS (curso) ============ */
.cases{padding:70px 0 76px;background:var(--card)}
.cases .head{padding:0 var(--pad);max-width:1180px;margin:0 auto 34px}
.cases h2{font-size:clamp(38px,10.4vw,62px);max-width:12ch}
.cases .head p{font-size:15px;margin-top:18px;max-width:40ch;font-weight:300;color:#2c4f54}
.case{margin-bottom:44px}
.case img{aspect-ratio:1.42;object-fit:cover;object-position:top}
.case div{padding:0 var(--pad);max-width:1180px;margin:16px auto 0}
.case b{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);font-weight:600}
.case h3{font-size:23px;font-weight:600;margin:10px 0 8px;line-height:1.18}
.case p{font-size:15px;max-width:44ch;font-weight:300;color:#2c4f54}

/* ============ 12 · CURRICULO ============ */
.curr{padding:70px var(--pad) 76px}
.curr h2{font-size:clamp(38px,10.4vw,62px);max-width:13ch;margin-bottom:14px}
.curr>p{font-size:15px;max-width:38ch;margin-bottom:30px;font-weight:300;color:#2c4f54}
.curr details{border-top:1px solid #14373c2b;padding:20px 0}
.curr summary{cursor:pointer;min-height:44px;font-size:19px;font-weight:600;
  list-style:none;display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.curr summary::-webkit-details-marker{display:none}
.curr summary:after{content:'+';font-family:'Instrument Serif',serif;font-size:26px;
  color:var(--terra);line-height:1}
.curr details[open] summary:after{content:'–'}
.curr summary em{font-style:normal;font-size:13px;font-weight:300;
  display:block;margin-top:7px;color:var(--green)}
.curr li{font-size:15px;padding:8px 0 8px 20px;position:relative;font-weight:300;color:#2c4f54}
.curr li:before{content:'';position:absolute;left:0;top:15px;width:9px;height:1px;background:var(--terra)}
.curr ul{margin-top:14px}

/* ============ 13 · PROVAS EM CARTAO ============ */
.cards{padding:70px var(--pad) 76px;background:var(--deep);color:var(--paper)}
.cards h2{font-size:clamp(38px,10.4vw,62px);max-width:13ch;margin-bottom:14px}
.cards h2 em{font-style:normal;color:var(--wash)}
.cards>p{font-size:15px;max-width:38ch;margin-bottom:34px;color:#f3eee3c4;font-weight:300}
.cardgrid{display:grid;gap:30px}
.cardgrid figure{margin:0;background:var(--card);padding:10px 10px 0;
  box-shadow:0 16px 34px #0004}
.cardgrid img{max-height:520px;object-fit:contain;object-position:top;background:var(--card)}
.cardgrid p{font-size:15px;font-weight:600;color:var(--ink);padding:13px 3px 0}
.cardgrid figcaption{font-size:11px;color:var(--green);padding:7px 3px 12px;font-weight:300}

/* ============ 14 · QUEM ENSINA ============ */
.about{position:relative}
.about>img{aspect-ratio:1/1.12;object-fit:cover;object-position:50% 22%}
.about-copy{padding:44px var(--pad) 56px;max-width:1180px;margin:0 auto}
.about h2{font-size:clamp(36px,9.8vw,60px);max-width:14ch;margin-bottom:22px}
.about h2 em{font-style:normal;color:var(--terra)}
.about p{font-size:15px;margin-top:16px;max-width:44ch;font-weight:300;color:#2c4f54}

/* ============ 15 · PARA QUEM ============ */
.forwho{padding:70px var(--pad) 76px;background:var(--soft)}
.forwho h2{font-size:clamp(36px,9.6vw,60px);max-width:15ch;margin-bottom:36px}
.forwho .col{margin-bottom:34px}
.forwho h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:600;margin-bottom:16px;color:var(--terra)}
.forwho .no h3{color:var(--green)}
.forwho li{padding:13px 0 13px 26px;border-top:1px solid #14373c26;
  font-size:15px;font-weight:300;position:relative;color:#2c4f54}
.forwho li:before{content:'✓';position:absolute;left:0;top:13px;color:var(--terra);font-size:14px}
.forwho .no li:before{content:'×';color:var(--green);font-size:17px;top:11px}

/* ============ 16 · OFERTA ============ */
.offer{padding:70px var(--pad) 80px}
.offer h2{font-size:clamp(38px,10.4vw,64px);max-width:13ch;margin-bottom:34px}
.offer h2 em{font-style:normal;color:var(--terra)}
.vrow{display:grid;grid-template-columns:1fr auto;gap:16px;
  border-top:1px solid #14373c2b;padding:19px 0}
.vrow b{font-weight:600;font-size:15px}
.vrow span{display:block;font-size:12.5px;margin-top:6px;color:var(--green);font-weight:300}
.vrow strong{font-family:'Instrument Serif',serif;font-weight:400;font-size:25px;white-space:nowrap}
.vtotal{display:flex;justify-content:space-between;gap:14px;align-items:baseline;
  border-top:2px solid var(--ink);padding:22px 0;font-size:14px}
.vtotal strong{font-family:'Instrument Serif',serif;font-weight:400;font-size:26px}
.vnote{font-size:11.5px;color:var(--green);margin:12px 0 30px;max-width:46ch;font-weight:300}
.card-offer{background:var(--deep);color:var(--paper);padding:34px 24px 30px}
.card-offer .kicker{color:var(--wash)}
.card-offer h3{font-size:24px;font-weight:600}
.bigprice{font-family:'Instrument Serif',serif;font-weight:400;font-size:96px;
  line-height:.86;margin:18px 0 8px}
.bigprice small{font-size:19px;font-family:'Hanken Grotesk',sans-serif}
.card-offer .pay{font-size:12.5px;color:#f3eee3b8;font-weight:300}
.card-offer ul{margin:26px 0 28px}
.card-offer li{padding:13px 0;border-top:1px solid #f3eee32b;font-size:15px;
  font-weight:300;padding-left:24px;position:relative}
.card-offer li:before{content:'✓';position:absolute;left:0;top:13px;color:var(--wash)}
.buy{display:flex;align-items:center;justify-content:space-between;gap:18px;width:100%;
  background:var(--paper);color:var(--deep);border:0;border-radius:60px;padding:18px 24px;
  min-height:58px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.buy i{font-style:normal;font-size:19px}
.status{font-size:11.5px;color:var(--wash);margin-top:14px;font-weight:300}
.warranty{margin-top:26px;border-top:1px solid #f3eee32b;padding-top:22px}
.warranty b{font-size:15px;font-weight:600}
.warranty p{font-size:13px;margin-top:8px;color:#f3eee3bd;font-weight:300}

/* ============ 17 · FAQ ============ */
.faq{padding:70px var(--pad) 80px;background:var(--card)}
.faq h2{font-size:clamp(38px,10.4vw,62px);max-width:11ch;margin-bottom:32px}
.faq h2 em{font-style:normal;color:var(--terra)}
.faq details{border-top:1px solid #14373c2b;padding:20px 0}
.faq summary{cursor:pointer;min-height:44px;font-size:17px;font-weight:600;
  list-style:none;display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:'+';font-family:'Instrument Serif',serif;font-size:26px;
  color:var(--terra);line-height:1}
.faq details[open] summary:after{content:'–'}
.faq p{font-size:15px;margin-top:14px;max-width:48ch;font-weight:300;color:#2c4f54}

/* ============ rodape + barra fixa ============ */
.foot{padding:36px var(--pad) 120px;text-align:center;font-size:12px;
  color:var(--green);border-top:1px solid #14373c22;line-height:1.7;font-weight:300}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--deep);
  color:var(--paper);padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-top:1px solid #f3eee333}
.sticky[hidden]{display:none}
.sticky small{display:block;font-size:10px;color:#f3eee3a8}
.sticky strong{font-family:'Instrument Serif',serif;font-weight:400;font-size:27px;line-height:1}
.sticky a{background:var(--paper);color:var(--deep);text-decoration:none;padding:13px 19px;
  border-radius:60px;font-size:11px;font-weight:600;letter-spacing:.08em;

const bOffer=d=>{
  const total=d.valores.reduce((s,r)=>s+r[2],0);
  return `<section class="offer" id="oferta">
  <span class="kicker">O investimento</span>
  <h2 class="display">O pacote completo.<br><em>Por ${money(d.preco)}, uma vez.</em></h2>

    <div>
      ${d.valores.map(([t,desc,v])=>`<div class="vrow"><div><b>${t}</b><span>${desc}</span></div>
        <strong>${money(v)}</strong></div>`).join('')}
      <div class="vtotal"><span>Valor estimado dos componentes</span><strong>${money(total)}</strong></div>
      <p class="vnote">Valores estimados para apresentar a composição da oferta. Não são preços anteriores do curso. Você compra o conjunto por ${money(d.preco)}.</p>
    </div>
    <div class="card-offer">
      <span class="kicker">Tudo incluído na compra</span>
      <h3>${d.nome}</h3>
      <div class="bigprice"><small>R$</small>${d.preco}</div>
      <p class="pay">Pagamento único · acesso imediato</p>
      <ul>${d.incluido.map(x=>'<li>'+x+'</li>').join('')}</ul>
      <button class="buy" type="button" id="comprar">Quero ${d.preco===197?'meu motor':'o curso completo'} <i>&rarr;</i></button>
      <p class="status" role="status">Prévia de revisão · compra ainda não conectada</p>
      <div class="warranty"><b>7 dias para conhecer por dentro.</b>
        <p>Você tem 7 dias para avaliar a compra. Se não for para você, peça o reembolso nesse prazo.</p></div>
    </div>
  </div>
</section>`};

const bFaq=d=>`<section class="faq">
  <span class="kicker">Antes de começar</span>
  <h2 class="display">Suas dúvidas.<br><em>Sem complicar.</em></h2>
  <div class="list">${d.faq.map(([q,a])=>`<details><summary><span>${q}</span></summary><p>${a}</p></details>`).join('')}</div>
</section>`;

/* =======================================================================
   ORDEM DAS SECOES, unica fonte da verdade
   ======================================================================= */
function montar(p){
  const d=DADOS[p], motor=p==='motor';
  return motor ? [
    bHero(d), bStack(d), bPain(d), bSolo(d,false), bVideo(d), bNum(d),
    bDeliver(d), bBeforeAfter(), bArtes(), bFlow(),
    bAbout(d), bForWho(d), bOffer(d), bFaq(d)
  ].join('') : [
    bHero(d), bOneProof(d), bPain(d), bSolo(d,false),
    bDeliver(d), bCases(d), bCurr(d), bCards(d),
    bAbout(d), bForWho(d), bOffer(d), bFaq(d)
  ].join('');
}

/* ---------- render ---------- */
let produto=new URLSearchParams(location.search).get('p')==='curso'?'curso':'motor';
let observer;

function render(){
  const d=DADOS[produto];
  document.querySelectorAll('[data-p]').forEach(b=>
    b.setAttribute('aria-pressed',b.dataset.p===produto));
  document.title=d.nome+' · Bruna Santanna';
  document.getElementById('page').innerHTML=montar(produto)+
    `<div class="sticky" hidden><div><small>${d.nome}</small><strong>${money(d.preco)}</strong></div>
      <a href="#oferta">Ver a oferta</a></div>
     <footer class="foot">bruna santanna. · A Virada IA<br>
      Prévia de revisão. Nenhuma alteração no site publicado.</footer>`;
  ligar();
}

function ligar(){
  const lb=document.getElementById('lightbox');
  document.querySelectorAll('[data-arte]').forEach(b=>b.onclick=()=>{
    lb.querySelector('img').src=IMG+'carrossel-'+b.dataset.arte+'.jpg';
    lb.showModal();
  });
  lb.querySelector('.close').onclick=()=>lb.close();

  const comprar=document.getElementById('comprar');
  if(comprar) comprar.onclick=()=>{
    document.querySelector('.status').textContent=
      'Esta é a prévia. O checkout será conectado na versão de publicação.';
  };

  const barra=document.querySelector('.sticky'), hero=document.querySelector('.hero');
  observer?.disconnect();
  observer=new IntersectionObserver(e=>barra.hidden=e[0].isIntersecting);
  observer.observe(hero);
}

document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
  produto=b.dataset.p;
  history.replaceState(null,'','?p='+produto);
  render(); scrollTo(0,0);
});
render();
</script>
