<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guia do Encontro 01 · Thaís</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#F3EEE3; --bg-2:#ECE5D6; --card:#FBF9F3;
  --ink:#14373C; --ink-2:#2C4F54; --green:#435D51;
  --terra:#B06E4A; --terra-l:#C4835E; --terra-d:#985A3B;
  --text:#233133; --muted:#6E7A75;
  --line:rgba(20,55,60,.16);
  --anton:'Anton', sans-serif; --hank:'Hanken Grotesk', sans-serif;
}
html{scroll-behavior:smooth;}
body{font-family:var(--hank);background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
::selection{background:var(--terra);color:#fff;}
.wrap{max-width:1080px;margin:0 auto;padding:0 30px;}
h1,h2,h3{font-family:var(--anton);font-weight:400;text-transform:uppercase;letter-spacing:-.01em;line-height:.92;}
.terra{color:var(--terra);}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--terra);}
.eyebrow::before{content:'';width:26px;height:2px;background:var(--terra);}
#bar{position:fixed;top:0;left:0;height:4px;width:0;background:var(--terra);z-index:99;transition:width .1s linear;}

.hd{position:sticky;top:0;z-index:50;background:rgba(243,238,227,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--ink);}
.hd-in{display:flex;align-items:center;justify-content:space-between;padding:14px 30px;max-width:1180px;margin:0 auto;}
.hd .logo{font-family:var(--anton);font-size:1.15rem;text-transform:uppercase;color:var(--ink);letter-spacing:.02em;display:inline-flex;align-items:center;}
.hd .logo .tag{font-family:var(--hank);font-weight:700;font-size:.6rem;letter-spacing:.12em;color:var(--terra);border:1.5px solid var(--terra);padding:3px 8px;border-radius:100px;margin-left:10px;text-transform:uppercase;}
.hd nav{display:flex;gap:20px;}
.hd nav a{font-size:.82rem;font-weight:600;color:var(--ink-2);text-decoration:none;transition:.18s;}
.hd nav a:hover{color:var(--terra);}
@media(max-width:860px){.hd nav{display:none;}}

section{padding:76px 0;position:relative;}
.snum{font-family:var(--anton);font-size:clamp(3rem,8vw,5.5rem);color:var(--terra);line-height:.8;display:block;}
.sec-h{font-size:clamp(2.1rem,6vw,3.6rem);color:var(--ink);margin:6px 0 14px;}
.lead{font-size:1.15rem;color:var(--ink-2);max-width:56ch;}
.lead b{color:var(--ink);font-weight:700;}
.alt{background:var(--bg-2);}

.hero{padding:64px 0 52px;}
.hero h1{font-size:clamp(3rem,11vw,6.6rem);color:var(--ink);margin:18px 0 0;}
.hero .sub{font-size:1.25rem;color:var(--ink-2);max-width:44ch;margin-top:22px;}
.hero .sub b{color:var(--ink);font-weight:700;}
.statrow{display:flex;gap:34px;flex-wrap:wrap;margin-top:38px;}
.statrow .n{font-family:var(--anton);font-size:2.4rem;color:var(--ink);line-height:1;}
.statrow .n span{color:var(--terra);}
.statrow .l{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:5px;}

.mani{background:var(--ink);padding:60px 0;}
.mani p{font-family:var(--anton);text-transform:uppercase;font-size:clamp(1.7rem,5vw,3.2rem);line-height:1.02;color:#fff;max-width:26ch;}
.mani p span{color:var(--terra-l);}
.marq{background:var(--bg-2);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:15px 0;overflow:hidden;}
.marq-t{display:flex;gap:40px;width:max-content;animation:slide 30s linear infinite;align-items:center;}
@keyframes slide{to{transform:translateX(-50%);}}
.marq span{font-family:var(--anton);font-size:1.4rem;text-transform:uppercase;color:var(--ink);white-space:nowrap;}
.marq span.d{color:var(--terra);}

.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px;}
@media(max-width:680px){.split{grid-template-columns:1fr;}}
.col{border-radius:16px;padding:24px 26px;}
.col.no{background:var(--bg-2);border:1.5px dashed var(--line);}
.col.yes{background:var(--ink);color:#fff;box-shadow:7px 7px 0 var(--terra);}
.alt .col.no{background:var(--card);}
.col .lab{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;}
.col.no .lab{color:var(--muted);} .col.yes .lab{color:var(--terra-l);}
.col h4{font-family:var(--hank);font-weight:800;font-size:1.35rem;text-transform:uppercase;line-height:1.08;margin-bottom:8px;}
.col.no h4{color:var(--ink);} .col.yes h4{color:#fff;}
.col p{font-size:.95rem;} .col.no p{color:var(--ink-2);} .col.yes p{color:rgba(255,255,255,.85);}

.callout{margin-top:20px;background:rgba(176,110,74,.1);border-left:4px solid var(--terra);border-radius:0 12px 12px 0;padding:15px 19px;font-size:1rem;color:var(--ink-2);}
.callout b{color:var(--terra);}

.spot{margin-top:26px;background:var(--ink);border-radius:18px;padding:32px 34px;box-shadow:7px 7px 0 var(--green);}
.spot .lab{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--terra-l);margin-bottom:12px;}
.spot h3{font-family:var(--anton);text-transform:uppercase;font-size:clamp(1.5rem,4vw,2.2rem);color:#fff;line-height:1;}
.spot h3 span{color:var(--terra-l);}
.spot p{color:rgba(255,255,255,.86);font-size:1.04rem;margin-top:14px;max-width:56ch;}
.spot p b{color:#fff;}
.spot .verbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
.spot .verbs i{font-style:normal;font-family:var(--anton);text-transform:uppercase;letter-spacing:.04em;font-size:1rem;color:#fff;background:rgba(196,131,94,.22);border:1.5px solid var(--terra-l);border-radius:100px;padding:7px 18px;}

.flow{display:flex;align-items:stretch;margin-top:28px;flex-wrap:wrap;}
.fstep{flex:1;min-width:150px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;}
.alt .fstep{background:var(--card);}
.fstep.dark{background:var(--ink);box-shadow:7px 7px 0 var(--terra);border-color:var(--ink);}
.fstep .fn{font-family:var(--anton);font-size:1.3rem;color:var(--terra);}
.fstep.dark .fn{color:var(--terra-l);}
.fstep .ft{font-family:var(--anton);text-transform:uppercase;font-size:1.02rem;color:var(--ink);margin-top:4px;line-height:1.02;}
.fstep.dark .ft{color:#fff;}
.fstep p{font-size:.83rem;color:var(--ink-2);margin-top:6px;}.fstep.dark p{color:rgba(255,255,255,.8);}
.farrow{display:flex;align-items:center;justify-content:center;font-family:var(--anton);color:var(--terra);font-size:1.7rem;padding:0 12px;}
@media(max-width:680px){.flow{flex-direction:column;}.farrow{transform:rotate(90deg);padding:8px 0;}}

.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
.chip{font-family:var(--hank);font-weight:700;font-size:.82rem;background:var(--bg-2);border:1.5px solid var(--line);border-radius:100px;padding:8px 16px;color:var(--ink);}
.alt .chip{background:var(--card);}
.chip.hot{background:var(--terra);color:#fff;border-color:var(--terra);}

/* linhas do DRE */
.lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:28px;}
.lcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px 20px;transition:.2s;}
.lcard:hover{border-color:var(--ink);box-shadow:6px 6px 0 var(--line);transform:translateY(-3px);}
.lcard .num{font-family:var(--anton);font-size:2.6rem;color:var(--terra);line-height:.9;}
.lcard .num small{font-family:var(--hank);font-size:.66rem;font-weight:700;letter-spacing:.14em;color:var(--muted);display:block;text-transform:uppercase;margin-bottom:2px;}
.lcard h4{font-family:var(--anton);text-transform:uppercase;font-size:1.12rem;color:var(--ink);margin-top:8px;line-height:1.02;}
.lcard p{font-size:.86rem;color:var(--ink-2);margin-top:6px;}
.lcard.wide{grid-column:span 2;}
@media(max-width:680px){.lcard.wide{grid-column:span 1;}}

/* benchmark bars */
.bench{margin-top:26px;display:grid;gap:16px;}
.brow{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;}
.alt .brow{background:var(--card);}
.brow .bt{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;}
.brow .bt h4{font-family:var(--anton);text-transform:uppercase;font-size:1.05rem;color:var(--ink);}
.brow .bt em{font-style:normal;font-family:var(--anton);font-size:1.5rem;color:var(--terra);}
.brow .track{margin-top:12px;height:14px;border-radius:100px;background:var(--bg-2);border:1.5px solid var(--line);overflow:hidden;}
.brow .fill{height:100%;background:var(--terra);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1);}
.in .brow .fill.f12{width:12%;} .in .brow .fill.f15{width:15%;}
.brow small{display:block;margin-top:8px;font-size:.82rem;color:var(--muted);}

/* passos numerados */
.steps{margin-top:30px;display:grid;gap:12px;counter-reset:st;}
.st{display:flex;gap:18px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:20px 22px;}
.alt .st{background:var(--card);}
.st.key{background:var(--ink);box-shadow:7px 7px 0 var(--terra);border-color:var(--ink);}
.st .stn{flex-shrink:0;width:38px;height:38px;border-radius:10px;background:var(--terra);color:#fff;font-family:var(--anton);font-size:1.25rem;display:flex;align-items:center;justify-content:center;line-height:1;}
.st.key .stn{background:var(--terra-l);color:var(--ink);}
.st .stc h4{font-family:var(--anton);text-transform:uppercase;font-size:1.16rem;color:var(--ink);line-height:1.02;}
.st.key .stc h4{color:#fff;}
.st .stc p{font-size:.95rem;color:var(--ink-2);margin-top:5px;}
.st.key .stc p{color:rgba(255,255,255,.86);}
.st .stc a{color:var(--terra);font-weight:700;text-decoration:none;border-bottom:2px solid var(--terra);}
.st.key .stc a{color:var(--terra-l);border-color:var(--terra-l);}
.st .stc a:hover{color:var(--terra-d);}

/* árvore de pastas */
.tree{margin-top:28px;background:var(--ink);border-radius:16px;padding:26px 28px;box-shadow:7px 7px 0 var(--terra);font-family:var(--hank);}
.tree .row{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.9);font-size:.95rem;padding:5px 0;font-weight:600;}
.tree .row.root{color:#fff;font-family:var(--anton);text-transform:uppercase;letter-spacing:.03em;font-size:1.05rem;}
.tree .ic{width:20px;text-align:center;flex-shrink:0;color:var(--terra-l);}
.tree .row.file{color:var(--terra-l);}
.tree .ind1{padding-left:26px;} .tree .ind2{padding-left:52px;}
.tree .note{color:rgba(255,255,255,.45);font-weight:400;font-size:.82rem;margin-left:6px;}

/* prompt */
.prompt{margin-top:22px;background:var(--card);border:1.5px solid var(--line);border-left:7px solid var(--terra);border-radius:0 14px 14px 0;overflow:hidden;}
.prompt .pl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:rgba(176,110,74,.1);}
.prompt .pl span{font-family:var(--hank);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap;}
.live{background:var(--terra);color:#fff;padding:3px 8px;border-radius:6px;letter-spacing:.06em;}
.copy{font-family:var(--hank);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--terra);border:none;border-radius:100px;padding:7px 16px;cursor:pointer;transition:.18s;white-space:nowrap;}
.copy:hover{background:var(--terra-d);}.copy.done{background:var(--green);}
.prompt pre{font-family:var(--hank);font-size:.93rem;line-height:1.58;color:var(--text);padding:20px;white-space:pre-wrap;word-break:break-word;}
.pnote{font-size:.9rem;color:var(--muted);margin-top:10px;max-width:60ch;}

/* regras de ouro */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:30px;}
.rule{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:24px 22px;transition:.2s;}
.alt .rule{background:var(--card);}
.rule:hover{border-color:var(--ink);box-shadow:6px 6px 0 var(--line);transform:translateY(-3px);}
.rule .rn{font-family:var(--anton);font-size:.8rem;letter-spacing:.14em;color:var(--terra);text-transform:uppercase;}
.rule h4{font-family:var(--anton);text-transform:uppercase;font-size:1.2rem;color:var(--ink);margin:6px 0 8px;line-height:1.02;}
.rule p{font-size:.92rem;color:var(--ink-2);}
.rule p b{color:var(--ink);font-weight:700;}

.misscard{background:var(--ink);color:#fff;border-radius:20px;padding:40px;box-shadow:9px 9px 0 var(--green);}
.misscard h2{color:#fff;font-size:clamp(1.8rem,5vw,2.8rem);}.misscard h2 span{color:var(--terra-l);}
.misscard .msub{color:rgba(255,255,255,.75);margin-top:10px;font-size:1rem;}
.check{margin-top:26px;display:grid;gap:11px;}
.ck{display:flex;gap:14px;align-items:flex-start;}
.ck .bx{flex-shrink:0;width:24px;height:24px;border-radius:6px;border:2px solid var(--terra-l);margin-top:1px;}
.ck p{color:rgba(255,255,255,.9);font-size:1.02rem;}.ck p b{color:#fff;}

.teaser{background:var(--bg-2);}
.teaser .pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);border:1.5px solid var(--terra);border-radius:100px;padding:5px 14px;margin-bottom:16px;}
.teaser h2{font-size:clamp(2rem,5.5vw,3.4rem);color:var(--ink);max-width:22ch;}.teaser h2 span{color:var(--terra);}
.teaser p{margin-top:14px;color:var(--ink-2);max-width:56ch;font-size:1.05rem;}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:26px;}
.tg{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:20px;}
.tg h4{font-family:var(--anton);text-transform:uppercase;font-size:1.08rem;color:var(--ink);}
.tg p{font-size:.88rem;color:var(--ink-2);margin-top:6px;}

.close{background:var(--ink);text-align:center;}
.close h2{font-size:clamp(2.4rem,8vw,5rem);color:#fff;}.close h2 span{color:var(--terra-l);}
.close .sig{margin-top:18px;font-size:.9rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--terra-l);}
.sign{display:flex;align-items:center;justify-content:space-between;gap:12px;color:rgba(255,255,255,.85);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:18px 30px;background:#0E282C;flex-wrap:wrap;}
.sign .ns{font-family:var(--anton);letter-spacing:.28em;color:var(--terra-l);font-size:1rem;}

.rv{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1);}
.rv.in{opacity:1;transform:none;}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;}.marq-t{animation:none;}.brow .fill{transition:none;}}
</style>
<style>
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:var(--bg);}
.gatebox{width:100%;max-width:520px;background:var(--ink);border-radius:20px;padding:44px 40px;box-shadow:9px 9px 0 var(--terra);}
.gatebox .eyebrow{color:var(--terra-l);}
.gatebox .eyebrow::before{background:var(--terra-l);}
.gatebox h1{font-family:var(--anton);text-transform:uppercase;font-size:clamp(2rem,7vw,3rem);color:#fff;line-height:.95;margin:16px 0 0;}
.gatebox h1 span{color:var(--terra-l);}
.gatebox p.g{color:rgba(255,255,255,.8);font-size:1.02rem;margin-top:16px;max-width:42ch;}
.gform{margin-top:28px;display:flex;flex-direction:column;gap:12px;}
.gform input{font-family:var(--hank);font-size:1rem;font-weight:600;color:var(--ink);background:var(--card);border:2px solid var(--card);border-radius:12px;padding:16px 18px;width:100%;outline:none;transition:.18s;}
.gform input:focus{border-color:var(--terra-l);}
.gform input::placeholder{color:var(--muted);font-weight:400;}
.gform button{font-family:var(--anton);text-transform:uppercase;letter-spacing:.04em;font-size:1.15rem;color:#fff;background:var(--terra);border:none;border-radius:12px;padding:16px 22px;cursor:pointer;transition:.18s;}
.gform button:hover{background:var(--terra-d);}
.gform button:disabled{opacity:.6;cursor:wait;}
.gerr{display:none;font-size:.92rem;font-weight:600;color:var(--terra-l);background:rgba(196,131,94,.16);border-left:3px solid var(--terra-l);border-radius:0 8px 8px 0;padding:11px 14px;}
.gerr.on{display:block;}
.gfoot{margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.14);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.45);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.gfoot .ns{font-family:var(--anton);letter-spacing:.28em;color:var(--terra-l);}
#app{display:none;}
</style>

<body>
<div id="bar"></div>

<div class="gate" id="gate">
  <div class="gatebox">
    <span class="eyebrow">Consultoria IA 1:1 · Material do encontro</span>
    <h1>SEU GUIA DO<br><span>ENCONTRO 01.</span></h1>
    <p class="g">Esta página é sua. Digite seu e-mail para abrir.</p>
    <form class="gform" id="gform" autocomplete="on">
      <input type="email" id="gmail" placeholder="seu@email.com" autocomplete="email" required spellcheck="false">
      <button type="submit" id="gbtn">Abrir o guia</button>
      <div class="gerr" id="gerr"></div>
    </form>
    <div class="gfoot"><span>Bruna Santanna · A Virada IA</span><span class="ns">NEWSCALE</span></div>
  </div>
</div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function abrir(email){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(email),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64(SALT),iterations:250000,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(PAYLOAD));
  return new TextDecoder().decode(plain);
}

function iniciar(html){
  const app=document.getElementById("app");
  app.innerHTML=html;
  document.getElementById("gate").remove();
  app.style.display="block";
  const bar=document.getElementById("bar");
  addEventListener("scroll",()=>{const h=document.documentElement;bar.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+"%";},{passive:true});
  app.querySelectorAll(".prompt").forEach(box=>{
    const btn=box.querySelector(".copy"),pre=box.querySelector("pre");
    if(!btn||!pre)return;
    btn.addEventListener("click",async()=>{
      try{await navigator.clipboard.writeText(pre.innerText.trim());}
      catch(e){const r=document.createRange();r.selectNode(pre);getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand("copy");getSelection().removeAllRanges();}
      const o=btn.textContent;btn.textContent="Copiado ✓";btn.classList.add("done");
      setTimeout(()=>{btn.textContent=o;btn.classList.remove("done");},1600);
    });
  });
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.1,rootMargin:"0px 0px -40px 0px"});
  app.querySelectorAll(".rv").forEach(el=>io.observe(el));
  setTimeout(()=>app.querySelectorAll(".rv").forEach(el=>el.classList.add("in")),2500);
}

const form=document.getElementById("gform"),campo=document.getElementById("gmail"),
      btn=document.getElementById("gbtn"),erro=document.getElementById("gerr");

function falhou(msg){erro.textContent=msg;erro.classList.add("on");btn.disabled=false;btn.textContent="Abrir o guia";}

async function tentar(email,silencioso){
  try{
    const html=await abrir(email.trim().toLowerCase());
    try{localStorage.setItem(KEYNAME,email.trim().toLowerCase());}catch(e){}
    iniciar(html);
    return true;
  }catch(e){
    if(!silencioso)falhou("Esse e-mail não abre este guia. Confira se é o mesmo endereço do nosso encontro. Se continuar sem abrir, me chame no WhatsApp.");
    return false;
  }
}

form.addEventListener("submit",async ev=>{
  ev.preventDefault();
  erro.classList.remove("on");
  btn.disabled=true;btn.textContent="Abrindo...";
  await tentar(campo.value,false);
});

(async()=>{
  let salvo=null;
  try{salvo=localStorage.getItem(KEYNAME);}catch(e){}
  if(salvo)await tentar(salvo,true);
})();
</script>
